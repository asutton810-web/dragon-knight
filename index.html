function noiseBuf(){const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
let NB=null;
function tone(f,t,type,vol,slide){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+t);g.gain.setValueAtTime(vol||.3,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(master);o.start(n);o.stop(n+t);}

};

   const cxp=900;g.fillStyle='#0e1026';g.fillRect(cxp,250,260,160);[[cxp-20,200,50],[cxp+105,160,50],[cxp+230,210,50]].forEach(([x,y,ww])=>{g.fillRect(x,y,ww,220);for(let i=0;i<4;i++)g.fillRect(x+i*14-2,y-10,8,12);g.beginPath();g.moveTo(x-6,y-10);g.lineTo(x+ww/2,y-60);g.lineTo(x+ww+6,y-10);g.fill();});
   g.fillStyle='rgba(255,190,90,.85)';[[cxp+125,200],[cxp+125,240],[cxp+0,240],[cxp+250,250],[cxp+60,300],[cxp+180,300]].forEach(([x,y])=>{g.fillRect(x,y,7,12);});
   ridge(g,w,h,410,30,'#101228',5,25);})});
 LAY.push({p:.55,c:makeLayer(2400,540,(g,w,h)=>{ridge(g,w,h,400,40,'#0b0c1d',33,20);
   g.fillStyle='#080916';for(let i=0;i<70;i++){const x=Math.random()*w,hh=rnd(40,110),y=430;g.beginPath();g.moveTo(x,y-hh);g.lineTo(x-hh*.22,y);g.lineTo(x+hh*.22,y);g.fill();}})});
}
function drawBG(){
 const sky=cx.createLinearGradient(0,0,0,VH);sky.addColorStop(0,'#0a0b24');sky.addColorStop(.5,'#2a1a44');sky.addColorStop(.78,'#7a2f3a');sky.addColorStop(1,'#d2643a');cx.fillStyle=sky;cx.fillRect(0,0,VW,VH);
 // stars
 cx.fillStyle='#fff';for(let i=0;i<80;i++){const x=((i*137.5)%1)*0+((i*97)%VW+VW-(cam*.02)%VW)%VW,y=(i*53)%Math.max(260,GROUND-200);cx.globalAlpha=.3+.5*Math.abs(Math.sin(t*1.5+i));cx.fillRect(x,y,1.6,1.6);}cx.globalAlpha=1;
 // moon
 const mx=VW*.78-cam*.03,my=Math.max(90,GROUND-345);const mg=cx.createRadialGradient(mx,my,10,mx,my,160);mg.addColorStop(0,'rgba(255,230,200,.5)');mg.addColorStop(1,'rgba(255,200,160,0)');cx.fillStyle=mg;cx.fillRect(mx-160,my-160,320,320);cx.fillStyle='#ffe9cf';cx.beginPath();cx.arc(mx,my,44,0,6.283);cx.fill();cx.fillStyle='rgba(200,170,150,.35)';cx.beginPath();cx.arc(mx-12,my-8,9,0,6.283);cx.arc(mx+14,my+12,6,0,6.283);cx.fill();
 for(const L of LAY){const w=L.c.width;let off=-(cam*L.p)%w;if(off>0)off-=w;for(let x=off;x<VW;x+=w)cx.drawImage(L.c,x,GROUND-455);}
}
function drawGround(){const gy=GROUND;const g=cx.createLinearGradient(0,gy-10,0,VH);g.addColorStop(0,'#2b2236');g.addColorStop(.15,'#1a1424');g.addColorStop(1,'#07060c');cx.fillStyle=g;cx.fillRect(cam-10,gy,VW+20,VH-gy);
 cx.fillStyle='rgba(255,140,80,.18)';cx.fillRect(cam-10,gy,VW+20,2);
 // stones
 cx.fillStyle='#120e1a';for(let x=Math.floor(cam/80)*80;x<cam+VW+80;x+=80){const h=(Math.sin(x*12.9898)*43758.5453)%1;cx.beginPath();cx.ellipse(x+h*40,gy+16+h*20,14+h*10,4,0,0,6.283);cx.fill();}
 // arena edges
 }
// ---------- loop ----------
let last=0;
function update(dt){t+=dt;
 // embers ambient
 if(Math.random()<.5)embers.push({x:cam+rnd(0,VW),y:VH+5,vx:rnd(-15,15),vy:-rnd(30,80),life:rnd(4,8),s:rnd(1,2.5)});
 for(const e of embers){e.x+=e.vx*dt+Math.sin(t+e.y*.02)*.3;e.y+=e.vy*dt;e.life-=dt;}embers=embers.filter(e=>e.life>0);
 if(state==='over'&&(DEMO||CAPTURE)&&t-overT>3){state='title';startGame();}
 if(state!=='play'){if(state==='title'){cam=lerp(cam,300+Math.sin(t*.2)*200,dt);}updFx(dt);return;}
 if(hitstop>0){hitstop-=dt;return;}
 updKnight(dt);
 const tc=clamp(P.x-VW*.45,-40,WORLD-VW+40);cam=lerp(cam,tc,Math.min(1,dt*5));
 dragons=dragons.filter(d=>updDragon(d,dt));
 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  if(s.type==='wave'){for(const d of dragons){if(d.dead||s.hit.has(d))continue;if(Math.abs(d.x-s.x)<50*d.size+30&&Math.abs(d.y-s.y)<60*d.size+30){s.hit.add(d);if(!P.atkHit.has(d))dragonHit(d,14,Math.sign(s.vx));}}continue;}
  if(Math.random()<.8)parts.push({x:s.x,y:s.y,vx:rnd(-30,30),vy:rnd(-30,30),life:.35,l0:.35,col:s.type==='ice'?'#9fe3ff':s.type==='venom'?'#a8ff5a':s.type==='orb'?'#c46bff':'#ffa23a',size:s.r*.7,g:-60,add:true});
  if(s.y>GROUND){s.life=0;burst(s.x,GROUND,5,'#ff9a3a',150,.3,3);}
  if(Math.abs(s.x-P.x)<28+s.r&&s.y>P.y-KH+10&&s.y<P.y+5){s.life=0;hurtKnight(s.dmg,Math.sign(s.vx)||1);}}
 shots=shots.filter(s=>s.life>0);
 // waves
 queue=queue.filter(q=>{if(t>=q.at){spawnDragon(q.ty,Math.random()<.5?1:-1);return false;}return true;});
 if(dragons.length===0&&queue.length===0){waveDelay-=dt;if(waveDelay<=0){startWave();waveDelay=2.2;}}
 if(bannerT>0)bannerT-=dt;
 updFx(dt);}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=1-dt*1.5;p.life-=dt;}parts=parts.filter(p=>p.life>0);if(parts.length>900)parts.splice(0,parts.length-900);
 for(const a of arcs)a.life-=dt;arcs=arcs.filter(a=>a.life>0);
 for(const x of texts){x.y-=50*dt;x.life-=dt;}texts=texts.filter(x=>x.life>0);
 shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*2);}
function render(){cx.setTransform(DPR*S,0,0,DPR*S,0,0);
 const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;
 cx.save();cx.translate(sx,sy);
 drawBG();
 cx.save();cx.translate(-cam,0);
 drawGround();
 // dynamic light pools on ground from fire shots
 cx.globalCompositeOperation='lighter';
 for(const s of shots){if(s.type==='wave')continue;const g=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);g.addColorStop(0,s.type==='ice'?'rgba(120,200,255,.25)':s.type==='venom'?'rgba(140,255,80,.22)':s.type==='orb'?'rgba(190,90,255,.3)':'rgba(255,130,40,.28)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(s.x-s.r*6,s.y-s.r*6,s.r*12,s.r*12);}
 cx.globalCompositeOperation='source-over';
 for(const d of dragons)if(d.boss)drawDragon(d);
 for(const d of dragons)if(!d.boss)drawDragon(d);
 if(P&&state!=='title')drawKnight();
 for(const a of arcs)drawArc(a);
 cx.globalCompositeOperation='lighter';
 for(const s of shots){if(s.type==='wave'){const k=s.life/.45;cx.save();cx.translate(s.x,s.y);cx.scale(Math.sign(s.vx),1);cx.strokeStyle='rgba(110,190,255,'+(.7*k)+')';cx.lineWidth=10*k;cx.beginPath();cx.arc(-20,0,s.r,-1.1,1.1);cx.stroke();cx.strokeStyle='rgba(230,250,255,'+k+')';cx.lineWidth=3;cx.stroke();cx.restore();continue;}
  const g=cx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);const c=s.type==='ice'?['#ffffff','#8fd8ff']:s.type==='venom'?['#f4ffd0','#6cd43a']:s.type==='orb'?['#ffffff','#a54bff']:['#fff3c0','#ff6a1a'];g.addColorStop(0,c[0]);g.addColorStop(.4,c[1]);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();}
 for(const p of parts){if(!p.add)continue;cx.globalAlpha=clamp(p.life/p.l0,0,1);cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.size*(.4+.6*p.life/p.l0),0,6.283);cx.fill();}
 cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
 for(const p of parts){if(p.add)continue;cx.globalAlpha=clamp(p.life/p.l0,0,1)*.5;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.size*(1.5-p.life/p.l0),0,6.283);cx.fill();}cx.globalAlpha=1;
 cx.fillStyle='rgba(255,170,90,.8)';for(const e of embers){cx.globalAlpha=Math.min(1,e.life/2)*.7;cx.fillRect(e.x,e.y,e.s,e.s);}cx.globalAlpha=1;
 cx.font='800 22px system-ui';cx.textAlign='center';for(const x of texts){cx.globalAlpha=clamp(x.life,0,1);cx.fillStyle='#000';cx.fillText(x.s,x.x+2,x.y+2);cx.fillStyle=x.col;cx.fillText(x.s,x.x,x.y);}cx.globalAlpha=1;
 cx.restore();
 // vignette
 const vg=cx.createRadialGradient(VW/2,VH*.55,VH*.35,VW/2,VH*.55,VW*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');cx.fillStyle=vg;cx.fillRect(0,0,VW,VH);
 cx.restore();
 if(flash>0){cx.fillStyle='rgba(255,240,220,'+flash*.6+')';cx.fillRect(0,0,VW,VH);}
 hud();}
function hud(){const portrait=PORT;
 if(state==='title'){titleScreen();return;}
 // health
 const x=16,y=14,w=Math.min(260,VW*.42);
 cx.fillStyle='rgba(0,0,0,.55)';rr(x,y,w+8,22,11);cx.fill();
 const hp=P.hp/P.max;const hg=cx.createLinearGradient(x,0,x+w,0);hg.addColorStop(0,'#ff3b3b');hg.addColorStop(1,'#ffb03b');cx.fillStyle=hg;rr(x+4,y+4,w*hp,14,7);cx.fill();
 cx.fillStyle='#fff';cx.font='800 12px system-ui';cx.textAlign='left';cx.fillText('KNIGHT  '+Math.ceil(P.hp),x+12,y+15.5);
 cx.textAlign='right';cx.font='900 22px system-ui';cx.fillStyle='#ffe2a8';cx.fillText(score.toLocaleString(),VW-16,34);
 cx.font='700 13px system-ui';cx.fillStyle='#bfc8ff';cx.fillText('WAVE '+wave+(best?'  ·  BEST '+best.toLocaleString():''),VW-16,52);
 const boss=dragons.find(d=>d.boss&&!d.dead);
 if(boss){const bw=Math.min(520,VW*.7),bx=(VW-bw)/2,by=portrait?72:20;cx.fillStyle='rgba(0,0,0,.6)';rr(bx-4,by-4,bw+8,20,10);cx.fill();const bg=cx.createLinearGradient(bx,0,bx+bw,0);bg.addColorStop(0,'#7a2bff');bg.addColorStop(1,'#ff3b6b');cx.fillStyle=bg;rr(bx,by,bw*Math.max(0,boss.hp/boss.max),12,6);cx.fill();cx.textAlign='center';cx.font='900 12px system-ui';cx.fillStyle='#fff';cx.fillText(boss.name,VW/2,by+28);}
 if(bannerT>0&&banner){const a=Math.min(1,bannerT*2,(2.4-bannerT)*4+.01);cx.globalAlpha=clamp(a,0,1);cx.textAlign='center';cx.font='900 '+(portrait?34:52)+'px system-ui';cx.fillStyle='rgba(0,0,0,.6)';cx.fillText(banner,VW/2+3,VH*.36+3);const g=cx.createLinearGradient(0,VH*.3,0,VH*.38);g.addColorStop(0,'#fff6d8');g.addColorStop(1,'#ff9a3c');cx.fillStyle=g;cx.fillText(banner,VW/2,VH*.36);cx.globalAlpha=1;}
 if(state==='over'){cx.fillStyle='rgba(5,4,12,.72)';cx.fillRect(0,0,VW,VH);cx.textAlign='center';cx.fillStyle='#ff6a4a';cx.font='900 '+(portrait?44:64)+'px system-ui';cx.fillText('FALLEN',VW/2,VH*.38);cx.fillStyle='#fff';cx.font='700 20px system-ui';cx.fillText('Score '+score.toLocaleString()+'   ·   Wave '+wave,VW/2,VH*.48);cx.fillStyle='#ffd27a';cx.fillText('Best '+best.toLocaleString(),VW/2,VH*.54);cx.fillStyle='#bfe3ff';cx.font='800 18px system-ui';cx.globalAlpha=.6+.4*Math.sin(t*4);cx.fillText(isTouch?'TAP TO RISE AGAIN':'PRESS ENTER TO RISE AGAIN',VW/2,VH*.66);cx.globalAlpha=1;}
}
function titleScreen(){const portrait=PORT;cx.fillStyle='rgba(5,4,15,.45)';cx.fillRect(0,0,VW,VH);
 // hero image
 const img=IMG.idle[Math.floor(t*10)%Math.max(1,IMG.idle.length)];
 if(img&&img.naturalWidth){const h=portrait?230:300,w=h*img.naturalWidth/img.naturalHeight;const ix=portrait?VW/2:VW*.72,iy=portrait?GROUND+8:VH*.92;
  const g=cx.createRadialGradient(ix,iy-h*.5,10,ix,iy-h*.5,h*.8);g.addColorStop(0,'rgba(90,170,255,.35)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(ix-h,iy-h*1.4,h*2,h*1.6);cx.drawImage(img,ix-w*(+img.dataset.ax||.5),iy-h,w,h);}
 const tx=portrait?VW/2:VW*.34;cx.textAlign='center';
 cx.font='900 '+(portrait?16:20)+'px system-ui';cx.fillStyle='#8fd0ff';cx.fillText('iHODL810',tx,portrait?VH*.15:VH*.3);
 cx.font='900 '+(portrait?44:68)+'px system-ui';const g=cx.createLinearGradient(0,VH*.2,0,VH*.42);g.addColorStop(0,'#fff6d8');g.addColorStop(1,'#ff8a3c');cx.fillStyle='rgba(0,0,0,.6)';cx.fillText('DRAGON',tx+3,(portrait?VH*.25:VH*.42)+3);cx.fillStyle=g;cx.fillText('DRAGON',tx,portrait?VH*.25:VH*.42);
 cx.fillStyle='#e8eeff';cx.font='900 '+(portrait?34:52)+'px system-ui';cx.fillText('KNIGHT',tx,portrait?VH*.33:VH*.53);
 cx.font='800 '+(portrait?15:18)+'px system-ui';cx.fillStyle='#bfe3ff';cx.globalAlpha=.6+.4*Math.sin(t*4);cx.fillText(isTouch?'TAP TO BEGIN':'PRESS ENTER TO BEGIN',tx,portrait?VH*.41:VH*.66);cx.globalAlpha=1;
 cx.font='600 '+(portrait?11:13)+'px system-ui';cx.fillStyle='rgba(220,225,255,.75)';
 const help=isTouch?['◀ ▶ move · JUMP · ⚔ slash · 🛡 block']:['A/D or ←/→ move · W/Space jump','J slash · K/Shift block · M mute'];help.forEach((s,i)=>cx.fillText(s,tx,(portrait?VH*.46:VH*.74)+i*18));
 if(best){cx.fillStyle='#ffd27a';cx.fillText('BEST '+best.toLocaleString(),tx,(portrait?VH*.46:VH*.74)+help.length*18+6);}
}
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);render();
 pad.classList.toggle('hide',!(isTouch||Q.has('pad'))||state!=='play');requestAnimationFrame(frame);}
window.__dbg=()=>({state,combo:P&&P.combo,T:Object.assign({},T),TP:Object.assign({},TP)});
buildBG();resize();
if(CAPTURE){window.__step=(n,dt)=>{for(let i=0;i<n;i++)update(dt);render();pad.classList.toggle('hide',state!=='play');};window.__start=()=>{startGame();};window.__wave=n=>{wave=n-1;dragons=[];queue=[];shots=[];waveDelay=.3;};window.__heal=()=>{P.hp=P.max;};window.__state=()=>({boss:(dragons.find(d=>d.boss)||{}).hp,state,wave,score,hp:P&&P.hp,dragons:dragons.length});}
else{if(DEMO)setTimeout(startGame,1500);requestAnimationFrame(frame);}
})();
